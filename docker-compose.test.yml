name: reachinbox-assignment-tests
services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: reachinbox_test
      POSTGRES_PASSWORD: isolated_test_password
      POSTGRES_DB: reachinbox_test
    ports: ["127.0.0.1:15432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox_test -d reachinbox_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.7-alpine
    ports: ["127.0.0.1:16379:6379"]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:19200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
